  <line x1="84" y1="50" x2="76" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="84" x2="50" y2="76" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
  <line x1="16" y1="50" x2="24" y2="50" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
