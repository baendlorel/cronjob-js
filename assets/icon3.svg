<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景 -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" />
  <!-- 外圈刻度环 -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#E2E8F0" stroke-width="2" />
  <!-- 刻度 -->
  <g stroke="#CBD5E1" stroke-width="2" stroke-linecap="round">
    <line x1="50" y1="8" x2="50" y2="14" />
    <line x1="92" y1="50" x2="86" y2="50" />
    <line x1="50" y1="92" x2="50" y2="86" />
    <line x1="8" y1="50" x2="14" y2="50" />
  </g>
  <!-- 强调弧（代表时间流转） -->
  <path d="M50 8 A42 42 0 0 1 92 50" fill="none" stroke="#2563EB" stroke-width="4"
    stroke-linecap="round" />
  <!-- 字母 K -->
  <path d="M36 28 L36 72 M36 50 L64 28 M36 50 L64 72" fill="none" stroke="#1E293B" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round" />
</svg>