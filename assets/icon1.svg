<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆角方块 -->
  <rect x="10" y="10" width="80" height="80" rx="18" fill="#0F172A"/>
  <!-- 网格线（表格感） -->
  <line x1="10" y1="38" x2="90" y2="38" stroke="#334155" stroke-width="1.5"/>
  <line x1="10" y1="62" x2="90" y2="62" stroke="#334155" stroke-width="1.5"/>
  <line x1="38" y1="10" x2="38" y2="90" stroke="#334155" stroke-width="1.5"/>
  <!-- 字母 K -->
  <path d="M30 28 L30 72 M30 50 L58 28 M30 50 L58 72" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 一个代表“任务”的小点 -->
  <circle cx="68" cy="50" r="4" fill="#38BDF8"/>
</svg>